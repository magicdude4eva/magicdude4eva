name: Latest blog post workflow

on:
  schedule:
    - cron: "15 6 * * *" # Daily at 06:15 UTC
  workflow_dispatch: # Run manually from the Actions tab

permissions:
  contents: write

# Shared with the other README-writing workflows so their pushes don't race
concurrency:
  group: profile-readme-write
  cancel-in-progress: false

jobs:
  update-readme-with-blog:
    name: Update this repo's README with latest blog posts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Wordpress
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://www.naschenweng.eu/feed"
          max_post_count: 5
          disable_item_validation: true
          commit_message: "chore: update latest blog posts"
