name: Update README stats cards

on:
  schedule:
    - cron: "30 0 * * *" # Daily at 00:30 UTC
  workflow_dispatch:

permissions:
  contents: write

# Shared with the other README-writing workflows so their pushes don't race
concurrency:
  group: profile-readme-write
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # GITHUB_TOKEN only sees public data. To include private contributions,
      # create a PAT (scopes: repo, read:user), save it as secret STATS_TOKEN
      # and it will be used automatically.
      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&count_private=true&theme=darcula&hide_border=true&bg_color=00000000
          path: profile/stats.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&hide_border=true&theme=darcula&bg_color=00000000&langs_count=8
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: update README stats cards" || exit 0
          git pull --rebase
          git push
